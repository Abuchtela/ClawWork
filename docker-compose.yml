version: "3.9"

# ClawWork – local development compose file
#
# Quick start:
#   cp .env.example .env        # fill in your API keys
#   docker compose up --build   # start backend + frontend
#
# Services:
#   backend  – FastAPI server  → http://localhost:8000
#   frontend – Vite dev server → http://localhost:3000
#
# Persistent agent data is written to the "livebench_data" named volume.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      LIVEBENCH_STATE_DIR: /var/data/livebench
      LIVEBENCH_DATA_PATH: /var/data/livebench/agent_data
    volumes:
      - livebench_data:/var/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --loglevel=error && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      VITE_BASE_PATH: /
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  livebench_data:
  frontend_modules:
